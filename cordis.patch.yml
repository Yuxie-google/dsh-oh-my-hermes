# dsh-oh-my-hermes bundle patch: one insert row registers the provider plugin.
# The row id is what a profile patch targets to configure this plugin; a second
# instance is another row with the same `name` and a different id.
#
# Every entry in `hosts` becomes its own provider in the model picker, so one
# plugin instance can front several SSH boxes.
- insert:
    - id: oh-my-hermes
      name: 'dsh-oh-my-hermes'
      config:
        # Add your own SSH host in Settings → 远程 Hermes after installation.
        hosts: []
        models:
          - id: hermes
            name: '远端默认模型'
            contextWindow: 200000
            maxTokens: 32000
